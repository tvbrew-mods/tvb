<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TV Browser</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #121317; color: #ffffff; font-family: sans-serif; }
  #glow { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #greet { position: absolute; left: 90px; top: 56px; font-size: 24px; color: #9a9ca3; }
  #clock { position: absolute; left: 90px; top: 90px; font-size: 64px; }
  #date { font-size: 26px; color: #9a9ca3; margin-left: 18px; }
  #actions { position: absolute; right: 90px; top: 70px; }
  .pill { display: inline-block; vertical-align: middle; margin-left: 18px; padding: 16px 30px; border-radius: 40px;
          background: #26282e; color: #c9cbd1; font-size: 26px; border: 3px solid #26282e; }
  .pill.focus { border-color: #ffffff; background: #34373f; color: #ffffff; }
  #search { min-width: 520px; }
  .lens { display: inline-block; width: 18px; height: 18px; border: 3px solid #c9cbd1; border-radius: 50%;
          margin-right: 16px; vertical-align: -3px; }
  /* Showcase: the selected bookmark in large */
  #hero { position: absolute; left: 90px; right: 90px; top: 280px; height: 300px; }
  #heroIcon { position: absolute; left: 0; top: 0; width: 280px; height: 280px; border-radius: 36px; overflow: hidden;
              background: #26282e; }
  #heroIcon img { position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; margin: -64px 0 0 -64px; display: none; }
  #heroLetter { position: absolute; left: 0; right: 0; top: 50%; margin-top: -70px; text-align: center; font-size: 120px; line-height: 140px; }
  #heroText { position: absolute; left: 340px; right: 0; top: 30px; }
  #title { font-size: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #subtitle { font-size: 30px; color: #9a9ca3; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint { font-size: 26px; color: #c9cbd1; margin-top: 34px; }
  /* Row of small tiles */
  #row { position: absolute; left: 0; right: 0; bottom: 120px; height: 190px; overflow: hidden; }
  #grid { position: absolute; left: 90px; top: 20px; white-space: nowrap;
          -webkit-transition: -webkit-transform 0.15s; transition: transform 0.15s; }
  .tile { position: relative; display: inline-block; vertical-align: top; width: 230px; height: 130px; margin-right: 28px;
          border-radius: 16px; border: 4px solid transparent; overflow: hidden; box-sizing: border-box; white-space: normal;
          -webkit-transition: -webkit-transform 0.12s; transition: transform 0.12s; }
  .tile.focus { border-color: #ffffff; -webkit-transform: scale(1.1); transform: scale(1.1); }
  .tile.moving { border-color: #378ADD; -webkit-transform: scale(1.1); transform: scale(1.1); }
  .tile .letter { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 54px; color: #ffffff; }
  .tile .name { position: absolute; left: 12px; right: 12px; bottom: 10px; text-align: center; font-size: 22px;
                color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile img { position: absolute; left: 50%; top: 16px; width: 56px; height: 56px; margin-left: -28px; display: none; }
  #empty { display: none; position: absolute; left: 90px; top: 20px; width: 760px; height: 130px; padding: 24px 30px;
           box-sizing: border-box; border: 3px dashed #4a4d55; border-radius: 16px; color: #9a9ca3; font-size: 26px; }
  /* Legend drawn like the remote buttons */
  #legend { position: absolute; left: 90px; right: 90px; bottom: 40px; font-size: 22px; color: #9a9ca3; }
  #legend .item { margin-right: 34px; }
  .chip { display: inline-block; min-width: 30px; padding: 3px 10px; margin-right: 8px; border-radius: 6px; text-align: center;
          font-size: 20px; background: #2e3038; color: #ffffff; }
  .chip.ok { background: #ffffff; color: #000000; }
  .chip.blue { background: #378ADD; color: #ffffff; }
  .chip.green { background: #3B9B3B; color: #ffffff; }
  #status { position: absolute; right: 0; top: 0; color: #f09595; display: none; }
  #modal { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; }
  #dialog { position: absolute; left: 50%; top: 50%; width: 1100px; margin-left: -550px; -webkit-transform: translateY(-50%);
            transform: translateY(-50%); background: #1b1e27; border: 2px solid #3d4150; border-radius: 18px;
            padding: 34px 40px; box-sizing: border-box; font-size: 28px; }
  #dialog .dtitle { font-size: 36px; margin-bottom: 22px; }
  #dialog .item { padding: 14px 22px; margin: 8px 0; border-radius: 12px; border: 3px solid transparent; background: #262a34; }
  #dialog .item.focus { border-color: #ffffff; background: #343946; }
  #dialog .row .item { display: inline-block; margin-right: 18px; min-width: 200px; text-align: center; }
  #dialog input { width: 100%; box-sizing: border-box; font-size: 34px; padding: 14px 18px; border-radius: 10px;
                  border: 3px solid #ffffff; background: #ffffff; color: #000000; }
  #dialog .hint { font-size: 22px; color: #8a8d99; margin-top: 16px; }
  #dialog .grow { margin: 6px 0; }
  #dialog .gk { display: inline-block; width: 280px; color: #ffffff; }
  #dialog .gd { color: #d8dae3; }
  #notice { position: absolute; left: 50%; bottom: 7%; width: 1000px; margin-left: -500px; padding: 18px 24px;
            box-sizing: border-box; text-align: center; font-size: 28px; color: #ffffff; background: rgba(20, 22, 28, 0.95);
            border: 2px solid #4a4d55; border-radius: 12px; display: none; }
  #debug { position: absolute; right: 20px; bottom: 20px; font-family: monospace; font-size: 16px; color: #ffffff;
           background: rgba(150, 0, 0, 0.9); padding: 8px 10px; border-radius: 6px; white-space: pre; display: none; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="app">
  <div id="greet"></div>
  <div id="clock"><span id="time"></span><span id="date"></span></div>
  <div id="actions">
    <div class="pill" id="search"><span class="lens"></span>Cerca o scrivi un indirizzo</div>
    <div class="pill" id="help">Guida</div>
  </div>
  <div id="hero">
    <div id="heroIcon"><img id="heroImg" alt=""><div id="heroLetter"></div></div>
    <div id="heroText"><div id="title"></div><div id="subtitle"></div><div id="hint"></div></div>
  </div>
  <div id="row"><div id="grid"></div><div id="empty">Nessun preferito: apri un sito e premi <span class="chip green">B</span>per aggiungerlo qui.</div></div>
  <div id="legend">
    <span class="item"><span class="chip ok">OK</span>apri</span><span class="item"><span class="chip blue">D</span>modifica</span><span class="item"><span class="chip">INFO</span>guida</span><span class="item"><span class="chip">EXIT</span>esci</span>
    <span id="status">&#9679; Funzioni sui siti non attive: premi EXIT e riapri</span>
  </div>
</div>
<div id="modal"><div id="dialog"></div></div>
<div id="notice"></div>
<div id="debug"></div>
<script>
/*
 * TVB home page. Served by TizenBrew's local module proxy, so it works even
 * when script injection is not active, and it has a fixed origin where the
 * bookmarks are stored (localStorage).
 * Plain ES5 for the old Chromium engine of Tizen TVs.
 */
(function () {
  'use strict';

  var VERSION = '0.1.0';
  var STORAGE_KEY = 'tvb.bookmarks';
  var MAX_BOOKMARKS = 120;
  var SEARCH_URL = 'https://www.google.com/search?q=';
  var COLORS = ['#185FA5', '#A32D2D', '#0F6E56', '#3C3489', '#993C1D', '#72243E', '#3B6D11', '#854F0B'];
  var DAYS = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
  var MONTHS = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto',
    'settembre', 'ottobre', 'novembre', 'dicembre'];
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, OK: 13, BACK: 10009, BLUE: 406, YELLOW: 405,
    INFO: 457, SELECT: 65376 };
  var GUIDE = [
    ['Nella home', ''],
    ['Frecce + OK', 'apri un preferito o la barra di ricerca'],
    ['D (blu)', 'modifica il preferito: rinomina, sposta, elimina'],
    ['Sui siti', ''],
    ['Frecce', 'evidenziano link e pulsanti'],
    ['OK', 'apre o preme l\'elemento evidenziato'],
    ['TOOLS (o 8)', 'attiva / disattiva il cursore'],
    ['C (giallo)', 'torna alla home'],
    ['B (verde)', 'aggiunge la pagina ai preferiti'],
    ['RETURN', 'indietro'],
    ['INFO (o 9)', 'guida dei tasti'],
    ['EXIT', 'esce dall\'app']
  ];

  var w = window;
  var $ = function (id) { return document.getElementById(id); };

  // ---------------------------------------------------------------- storage
  function loadBookmarks() {
    try {
      var list = JSON.parse(w.localStorage.getItem(STORAGE_KEY) || '[]');
      var clean = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i] && typeof list[i].url === 'string' && /^https?:\/\//.test(list[i].url)) {
          clean.push({ url: list[i].url, title: String(list[i].title || '') });
        }
      }
      return clean;
    } catch (e) {
      return [];
    }
  }

  function saveBookmarks() {
    try {
      w.localStorage.setItem(STORAGE_KEY, JSON.stringify(bookmarks));
      return true;
    } catch (e) {
      showNotice('Impossibile salvare i preferiti', 3000);
      return false;
    }
  }

  function normalizeUrl(url) {
    return String(url).split('#')[0];
  }

  function hostOf(url) {
    var m = /^https?:\/\/([^\/?#:]+)/i.exec(url);
    return m ? m[1].replace(/^www\./, '') : url;
  }

  function addBookmark(url, title) {
    url = normalizeUrl(url);
    if (!/^https?:\/\//.test(url)) {
      return 'invalid';
    }
    for (var i = 0; i < bookmarks.length; i++) {
      if (normalizeUrl(bookmarks[i].url) === url) {
        return 'exists';
      }
    }
    if (bookmarks.length >= MAX_BOOKMARKS) {
      return 'full';
    }
    title = String(title || '').replace(/\s+/g, ' ').substring(0, 80) || hostOf(url);
    bookmarks.push({ url: url, title: title });
    return saveBookmarks() ? 'added' : 'error';
  }

  // ---------------------------------------------------------------- query string
  function readQuery() {
    var out = {};
    var q = w.location.search.replace(/^\?/, '');
    if (!q) {
      return out;
    }
    var parts = q.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      try {
        out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      } catch (e) { /* ignore malformed parts */ }
    }
    return out;
  }

  var bookmarks = loadBookmarks();
  var query = readQuery();

  // Opened by a website to save a bookmark
  if (query.add) {
    var result = addBookmark(query.add, query.title);
    if (query.mode === 'frame') {
      try { w.parent.postMessage({ __tvbHome: 1, result: result }, '*'); } catch (e) { /* ignore */ }
      return; // hidden frame: no interface
    }
    try { w.history.replaceState(null, '', w.location.pathname); } catch (e) { /* ignore */ }
    w.setTimeout(function () {
      showNotice(result === 'exists' ? 'Già nei preferiti' : (result === 'added' ? 'Aggiunto ai preferiti' :
        'Impossibile salvare il preferito'), 1500);
    }, 0);
    if (query.mode === 'nav') {
      w.setTimeout(function () { w.history.back(); }, 1500);
    }
  }

  // ---------------------------------------------------------------- notice
  var noticeTimer = null;
  function showNotice(text, ms) {
    var n = $('notice');
    n.textContent = text;
    n.style.display = 'block';
    if (noticeTimer) {
      w.clearTimeout(noticeTimer);
    }
    noticeTimer = w.setTimeout(function () { n.style.display = 'none'; }, ms || 2500);
  }

  // ---------------------------------------------------------------- clock
  function updateClock() {
    var d = new Date();
    var h = d.getHours();
    var m = d.getMinutes();
    $('time').textContent = h + ':' + (m < 10 ? '0' + m : m);
    $('date').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
    $('greet').textContent = h >= 5 && h < 12 ? 'Buongiorno' : (h >= 12 && h < 18 ? 'Buon pomeriggio' : 'Buonasera');
  }

  // ---------------------------------------------------------------- tiles
  function colorFor(url) {
    var host = hostOf(url);
    var sum = 0;
    for (var i = 0; i < host.length; i++) {
      sum = (sum * 31 + host.charCodeAt(i)) % 100000;
    }
    return COLORS[sum % COLORS.length];
  }

  function hexToRgba(hex, alpha) {
    var n = parseInt(hex.substring(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + alpha + ')';
  }

  function makeTile(b, index) {
    var tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.background = colorFor(b.url);
    var letter = document.createElement('div');
    letter.className = 'letter';
    letter.textContent = (b.title || hostOf(b.url)).charAt(0).toUpperCase();
    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = b.title || hostOf(b.url);
    // The site's own icon, if it has one (no external icon services)
    var img = document.createElement('img');
    img.onload = function () {
      if (img.naturalWidth > 8) {
        img.style.display = 'block';
        letter.style.display = 'none';
      }
    };
    img.src = b.url.replace(/^(https?:\/\/[^\/?#]+).*$/, '$1') + '/favicon.ico';
    tile.appendChild(img);
    tile.appendChild(letter);
    tile.appendChild(name);
    tile.setAttribute('data-index', String(index));
    return tile;
  }

  function renderGrid() {
    var grid = $('grid');
    while (grid.firstChild) {
      grid.removeChild(grid.firstChild);
    }
    for (var i = 0; i < bookmarks.length; i++) {
      grid.appendChild(makeTile(bookmarks[i], i));
    }
    $('empty').style.display = bookmarks.length ? 'none' : 'block';
  }

  // Showcase: the selected bookmark (or the search) in large
  var heroUrl = null;
  function renderHero(b) {
    var img = $('heroImg');
    var letter = $('heroLetter');
    if (!b) {
      heroUrl = null;
      $('heroIcon').style.background = '#26282e';
      img.style.display = 'none';
      letter.style.display = 'block';
      letter.textContent = '?';
      return;
    }
    if (heroUrl === b.url) {
      return;
    }
    heroUrl = b.url;
    $('heroIcon').style.background = colorFor(b.url);
    letter.textContent = (b.title || hostOf(b.url)).charAt(0).toUpperCase();
    letter.style.display = 'block';
    img.style.display = 'none';
    img.onload = function () {
      if (heroUrl === b.url && img.naturalWidth > 8) {
        img.style.display = 'block';
        letter.style.display = 'none';
      }
    };
    img.src = faviconOf(b.url);
  }

  function faviconOf(url) {
    return url.replace(/^(https?:\/\/[^\/?#]+).*$/, '$1') + '/favicon.ico';
  }

  // ---------------------------------------------------------------- focus
  // zone "top": 0 = search, 1 = help. zone "grid": index in bookmarks.
  var focus = { zone: 'top', top: 0, grid: 0 };
  var moving = null; // { from: index, original: copy of the list }

  function applyFocus() {
    $('search').className = 'pill' + (focus.zone === 'top' && focus.top === 0 ? ' focus' : '');
    $('help').className = 'pill' + (focus.zone === 'top' && focus.top === 1 ? ' focus' : '');
    var tiles = $('grid').childNodes;
    for (var i = 0; i < tiles.length; i++) {
      var on = focus.zone === 'grid' && focus.grid === i;
      tiles[i].className = 'tile' + (on ? (moving ? ' moving' : ' focus') : '');
    }
    var glowColor = '#3a3f4a';
    if (focus.zone === 'grid' && bookmarks[focus.grid]) {
      var b = bookmarks[focus.grid];
      renderHero(b);
      $('title').textContent = b.title;
      $('subtitle').textContent = hostOf(b.url);
      $('hint').textContent = moving ? 'Sposta con le frecce, OK per confermare, RETURN per annullare' :
        'OK per aprire  ·  D per modificare';
      glowColor = colorFor(b.url);
      scrollToTile(focus.grid);
    } else {
      renderHero(null);
      $('heroLetter').textContent = focus.top === 1 ? 'i' : 'www';
      $('heroLetter').style.fontSize = focus.top === 1 ? '120px' : '64px';
      $('title').textContent = focus.top === 1 ? 'Guida dei tasti' : 'Cerca sul web';
      $('subtitle').textContent = focus.top === 1 ? 'Tutti i comandi del telecomando' : 'oppure scrivi l\'indirizzo di un sito';
      $('hint').textContent = 'OK per aprire';
    }
    if (focus.zone === 'grid') {
      $('heroLetter').style.fontSize = '120px';
    }
    $('glow').style.background = 'radial-gradient(circle at 15% 10%, ' + hexToRgba(glowColor, 0.35) +
      ' 0%, rgba(18, 19, 23, 0) 60%)';
  }

  // Horizontal row: slide it so the selected tile stays on screen
  function scrollToTile(index) {
    var step = 258; // tile width + margin
    var visible = Math.floor((w.innerWidth - 180) / step);
    var shift = Math.max(0, index - visible + 1) * step;
    var value = 'translateX(' + (-shift) + 'px)';
    $('grid').style.webkitTransform = value;
    $('grid').style.transform = value;
  }

  function moveFocus(dir) {
    var n = bookmarks.length;
    if (focus.zone === 'top') {
      if (dir === 'left') { focus.top = 0; }
      if (dir === 'right') { focus.top = 1; }
      if (dir === 'down' && n) { focus.zone = 'grid'; focus.grid = Math.min(focus.grid, n - 1); }
    } else {
      if (dir === 'left' && focus.grid > 0) { focus.grid -= 1; }
      if (dir === 'right' && focus.grid + 1 < n) { focus.grid += 1; }
      if (dir === 'up') { focus.zone = 'top'; }
    }
    applyFocus();
  }

  function moveBookmark(dir) {
    var n = bookmarks.length;
    var i = focus.grid;
    var j = i;
    if (dir === 'left' && i > 0) { j = i - 1; }
    if (dir === 'right' && i + 1 < n) { j = i + 1; }
    if (j === i) {
      return;
    }
    var item = bookmarks.splice(i, 1)[0];
    bookmarks.splice(j, 0, item);
    focus.grid = j;
    renderGrid();
    applyFocus();
  }

  // ---------------------------------------------------------------- dialogs
  var dialog = null; // { type, items, index, onOk, onBack }

  function openDialog(d) {
    dialog = d;
    var box = $('dialog');
    while (box.firstChild) {
      box.removeChild(box.firstChild);
    }
    var title = document.createElement('div');
    title.className = 'dtitle';
    title.textContent = d.title;
    box.appendChild(title);

    if (d.type === 'input') {
      var input = document.createElement('input');
      input.type = 'text';
      input.value = d.value || '';
      box.appendChild(input);
      d.input = input;
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = d.hint || 'OK o "Fatto" per confermare, RETURN per annullare';
      box.appendChild(hint);
    } else if (d.type === 'guide') {
      for (var g = 0; g < d.rows.length; g++) {
        var row = document.createElement('div');
        row.className = 'grow';
        var k = document.createElement('span');
        k.className = d.rows[g][1] ? 'gk' : '';
        k.textContent = d.rows[g][0];
        if (!d.rows[g][1]) {
          k.style.color = '#ffffff';
          k.style.fontSize = '30px';
        }
        var desc = document.createElement('span');
        desc.className = 'gd';
        desc.textContent = d.rows[g][1];
        row.appendChild(k);
        row.appendChild(desc);
        box.appendChild(row);
      }
      var foot = document.createElement('div');
      foot.className = 'hint';
      foot.textContent = 'INFO o RETURN per chiudere  -  v' + VERSION;
      box.appendChild(foot);
    } else {
      var container = box;
      if (d.horizontal) {
        container = document.createElement('div');
        container.className = 'row';
        box.appendChild(container);
      }
      d.nodes = [];
      for (var i = 0; i < d.items.length; i++) {
        var item = document.createElement('div');
        item.className = 'item';
        item.textContent = d.items[i].label;
        container.appendChild(item);
        d.nodes.push(item);
      }
      d.index = d.index || 0;
      paintDialog();
    }
    $('modal').style.display = 'block';
    if (d.input) {
      d.input.focus(); // the TV keyboard opens
    }
  }

  function paintDialog() {
    if (!dialog || !dialog.nodes) {
      return;
    }
    for (var i = 0; i < dialog.nodes.length; i++) {
      dialog.nodes[i].className = 'item' + (i === dialog.index ? ' focus' : '');
    }
  }

  function closeDialog() {
    if (dialog && dialog.input) {
      try { dialog.input.blur(); } catch (e) { /* ignore */ }
    }
    dialog = null;
    $('modal').style.display = 'none';
  }

  function dialogKey(code) {
    var d = dialog;
    if (code === KEY.BACK) {
      closeDialog();
      if (d.onBack) { d.onBack(); }
      return true;
    }
    if (d.type === 'guide') {
      if (code === KEY.INFO || code === 57) {
        closeDialog();
      }
      return true;
    }
    if (d.type === 'input') {
      if (code === KEY.OK || code === KEY.SELECT) {
        var value = d.input.value;
        closeDialog();
        d.onOk(value);
        return true;
      }
      return false; // letters, digits and arrows belong to the field
    }
    var prev = d.horizontal ? KEY.LEFT : KEY.UP;
    var next = d.horizontal ? KEY.RIGHT : KEY.DOWN;
    if (code === prev) { d.index = Math.max(0, d.index - 1); paintDialog(); }
    if (code === next) { d.index = Math.min(d.items.length - 1, d.index + 1); paintDialog(); }
    if (code === KEY.OK) {
      var action = d.items[d.index].action;
      closeDialog();
      if (action) { action(); }
    }
    return true;
  }

  function openGuide() {
    openDialog({ type: 'guide', title: 'TV Browser - tasti', rows: GUIDE });
  }

  function openSearch() {
    openDialog({
      type: 'input',
      title: 'Cerca o scrivi un indirizzo',
      hint: 'Un indirizzo (es. wikipedia.org) apre il sito, altrimenti cerca su Google. RETURN per annullare.',
      onOk: function (text) {
        var url = toUrl(text);
        if (url) {
          w.location.href = url;
        }
      }
    });
  }

  function toUrl(text) {
    var t = String(text || '').replace(/^\s+|\s+$/g, '');
    if (!t) {
      return null;
    }
    if (/^https?:\/\//i.test(t)) {
      return t;
    }
    if (!/\s/.test(t)) {
      if (/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/.*)?$/i.test(t)) {
        return 'http://' + t;
      }
      if (/^[^\/:?#]+\.[a-z]{2,}(:\d+)?([\/?#].*)?$/i.test(t)) {
        return 'https://' + t;
      }
    }
    return SEARCH_URL + encodeURIComponent(t);
  }

  function openEditMenu() {
    var b = bookmarks[focus.grid];
    if (!b) {
      return;
    }
    openDialog({
      type: 'menu',
      title: b.title,
      items: [
        { label: 'Rinomina', action: renameBookmark },
        { label: 'Sposta', action: startMoving },
        { label: 'Elimina', action: confirmDelete },
        { label: 'Annulla', action: null }
      ]
    });
  }

  function renameBookmark() {
    var b = bookmarks[focus.grid];
    openDialog({
      type: 'input',
      title: 'Rinomina preferito',
      value: b.title,
      onOk: function (text) {
        var name = String(text || '').replace(/\s+/g, ' ').replace(/^\s|\s$/g, '').substring(0, 80);
        if (name) {
          b.title = name;
          saveBookmarks();
          renderGrid();
          applyFocus();
        }
      }
    });
  }

  function startMoving() {
    moving = { original: bookmarks.slice(0), from: focus.grid };
    applyFocus();
  }

  function stopMoving(keep) {
    if (!keep) {
      bookmarks = moving.original;
      focus.grid = moving.from;
    } else {
      saveBookmarks();
    }
    moving = null;
    renderGrid();
    applyFocus();
  }

  function confirmDelete() {
    var b = bookmarks[focus.grid];
    openDialog({
      type: 'menu',
      horizontal: true,
      title: 'Eliminare "' + b.title + '"?',
      index: 1,
      items: [
        { label: 'Elimina', action: function () {
          bookmarks.splice(focus.grid, 1);
          saveBookmarks();
          if (focus.grid >= bookmarks.length) { focus.grid = bookmarks.length - 1; }
          if (focus.grid < 0) { focus.grid = 0; focus.zone = 'top'; }
          renderGrid();
          applyFocus();
          showNotice('Preferito eliminato', 2000);
        } },
        { label: 'Annulla', action: null }
      ]
    });
  }

  // ---------------------------------------------------------------- debug (key 0)
  var debugOn = false;
  function updateDebug() {
    var box = $('debug');
    if (!debugOn) {
      box.style.display = 'none';
      return;
    }
    var injected = !!(w.__TVB__ && w.__TVB__.injected);
    box.textContent = 'TVB home v' + VERSION + '\ninjection: ' + (injected ? 'yes (v' + w.__TVB__.version + ')' : 'NO') +
      '\nbookmarks: ' + bookmarks.length + '\nviewport: ' + w.innerWidth + 'x' + w.innerHeight;
    box.style.display = 'block';
  }

  // ---------------------------------------------------------------- injection check
  function checkInjection() {
    var ok = !!(w.__TVB__ && w.__TVB__.injected);
    $('status').style.display = ok ? 'none' : 'inline';
    updateDebug();
  }

  // ---------------------------------------------------------------- keys
  var DIRS = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };

  function onKeyDown(ev) {
    var code = ev.keyCode || ev.which || 0;
    var used = true;
    if (dialog) {
      used = dialogKey(code);
    } else if (moving) {
      if (DIRS[code]) { moveBookmark(DIRS[code]); }
      else if (code === KEY.OK) { stopMoving(true); showNotice('Posizione salvata', 1500); }
      else if (code === KEY.BACK) { stopMoving(false); }
      else { used = false; }
    } else if (DIRS[code]) {
      moveFocus(DIRS[code]);
    } else if (code === KEY.OK) {
      if (focus.zone === 'top') {
        if (focus.top === 0) { openSearch(); } else { openGuide(); }
      } else if (bookmarks[focus.grid]) {
        w.location.href = bookmarks[focus.grid].url;
      }
    } else if (code === KEY.BLUE) {
      if (focus.zone === 'grid') { openEditMenu(); }
    } else if (code === KEY.INFO || code === 57) {
      openGuide();
    } else if (code === 48) {
      debugOn = !debugOn;
      updateDebug();
    } else if (code === KEY.BACK) {
      showNotice('Per uscire premi EXIT sul telecomando', 3000);
    } else {
      used = false;
    }
    if (used) {
      ev.preventDefault();
      ev.stopPropagation();
    }
  }

  // ---------------------------------------------------------------- start
  w.addEventListener('keydown', onKeyDown, true);
  updateClock();
  w.setInterval(updateClock, 15000);
  renderGrid();
  if (bookmarks.length) {
    focus.zone = 'grid';
  }
  applyFocus();
  w.setTimeout(checkInjection, 4000);
  w.setTimeout(checkInjection, 9000);
})();
</script>
</body>
</html>
